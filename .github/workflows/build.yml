name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TurboClean-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Opublikuj APK jako Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk TurboClean.apk
          gh release delete turboclean-latest -y --cleanup-tag || true
          gh release create turboclean-latest TurboClean.apk \
            --target "${{ github.sha }}" \
            --title "TurboClean (najnowsza wersja)" \
            --notes "Pobierz TurboClean.apk i zainstaluj na telefonie."
