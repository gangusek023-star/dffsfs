name: Build Fala Telefon APK

on:
  push:
    branches: [ telefon ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Fala-Telefon.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telefon-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Fala Telefon v1.0.${{ github.run_number }}
          body: Aplikacja Telefon – pobierz Fala-Telefon.apk i zainstaluj.
          files: Fala-Telefon.apk
