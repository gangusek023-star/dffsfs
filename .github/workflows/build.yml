name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TurboCPU-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Opublikuj APK jako Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk TurboCPU.apk
          gh release delete turbocpu-latest -y --cleanup-tag || true
          gh release create turbocpu-latest TurboCPU.apk \
            --target "${{ github.sha }}" \
            --title "TurboCPU (najnowsza wersja)" \
            --notes "Wymaga roota. Pobierz TurboCPU.apk i zainstaluj na telefonie."
