name: Build Ogrod APK

on:
  push:
    branches: [ ogrod-gra ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Ogrod-w-Oblezeniu.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ogrod-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Ogród w Oblężeniu v1.0.${{ github.run_number }}
          body: Gra obronna – pobierz Ogrod-w-Oblezeniu.apk i zainstaluj.
          files: Ogrod-w-Oblezeniu.apk
